        * {

            margin: 0;

        }

        body {
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 520px;
            padding: 30px 20px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 6px;
            color: #ff6b6b;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            text-align: left;
            margin-bottom: 10px;
            color: #495057;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .option-group {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .option-group.col-2 {
            grid-template-columns: repeat(2, 1fr);
        }

        .btn-option {
            background: #f1f3f5;
            border: 2px solid transparent;
            padding: 12px 4px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #495057;
            white-space: nowrap;
        }

        .btn-option:hover {
            background: #e9ecef;
        }

        .btn-option.selected {
            background: #fff5f5;
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        .btn-submit {
            width: 100%;
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
            transition: transform 0.1s ease, background-color 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #fa5252;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* 결과 화면 */
        .result-box {
            display: none;
            margin-top: 25px;
            padding: 25px 20px;
            background: #fff9db;
            border-radius: 18px;
            border: 2px dashed #ffe066;
            animation: fadeIn 0.4s ease-in-out;
        }

        .result-box h2 {
            font-size: 1rem;
            color: #f08c00;
            margin-bottom: 8px;
        }

        .result-box .menu-name {
            font-size: 1.8rem;
            font-weight: 800;
            color: #212529;
            margin: 10px 0 4px;
            word-break: keep-all;
        }

        .result-box .menu-price {
            font-size: 1rem;
            font-weight: 700;
            color: #e67e22;
            margin-bottom: 18px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-secondary {
            background: white;
            border: 1px solid #ced4da;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            color: #495057;
            transition: background 0.2s;
        }

        .btn-secondary:hover {
            background: #f8f9fa;
        }

        /* 리스트 영역 */
        .menu-list-container {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 12px;
            border: 1px solid #e9ecef;
            text-align: left;
            max-height: 280px;
            overflow-y: auto;
        }

        .menu-list-container h3 {
            font-size: 0.95rem;
            color: #343a40;
            margin-bottom: 10px;
            border-bottom: 2px solid #ff6b6b;
            padding-bottom: 5px;
        }

        .category-header {
            font-size: 0.9rem;
            font-weight: bold;
            color: #495057;
            margin: 12px 0 6px 0;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .menu-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            background: #f1f3f5;
            color: #495057;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
        }

        .tag .price {
            color: #ff6b6b;
            font-weight: bold;
            margin-left: 3px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }

            const buttons = document.querySelectorAll(`#${groupId} .btn-option`);
            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    buttons.forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');

                });
            });

            const filtered = menuData.filter(m =>

                m.temp === selectedTemp &&
                m.priceGroup === selectedPrice
            );

            const menuPrice = document.getElementById('menuPrice');

            document.getElementById('conditionListContainer').style.display = 'none';
            document.getElementById('allListContainer').style.display = 'none';

            if (filtered.length > 0) {

            const filtered = menuData.filter(m =>

            );
